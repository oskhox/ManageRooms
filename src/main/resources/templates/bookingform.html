<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Booking Form</title>
</head>
<body>
<link rel="stylesheet" th:href="@{/css/bookingform.css}" />

<div class="form-container">

    <div id="loginForm" class="form-card">
        <h2>Login</h2>
        <form th:action="@{/bookcustomer}" method="post">
            <input type="text" name="username" placeholder="Username" required />
            <input type="password" name="password" placeholder="Password" required />
            <button onclick="showRoom()">Choose Room</button>
        </form>

    </div>


    <div id="registerForm" class="form-card" style="display:none;">
        <h2>Register</h2>
        <form th:action="@{/bookroom}" method="post">
            <input type="text" name="username" placeholder="Username" required />
            <input type="email" name="email" placeholder="Email" required />
            <input type="password" name="password" placeholder="Password" required />
            <button type="submit">Book</button>
        </form>
        <button onclick="showCustomer()">Back to Customer form</button>
    </div>
</div>
<script th:src="@{/js/bookingscript.js}"></script>
</body>
</html>
