<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <title>Hantera kunder</title>
</head>

<body>
<header class="header">
    <h1>Hantera kunder</h1>
</header>
<nav>
    <a th:href="@{/}">Hem</a> |
    <a th:href="@{/customer}">Hantera kunder</a> |
    <a th:href="@{/bookings}">Alla bokningar</a> |
    <a th:href="@{/bookings/create}">Skapa bokning</a>
</nav>

<div class="customer-container">
    <h3>Alla kunder</h3>
    <div class="allCustomersTable">
        <table>
            <tbody>
            <tr th:each="customer : ${allCustomers}">
                <td th:text="${customer.firstName + ' ' + customer.lastName}"></td>
                <td th:text="${customer.email}"></td>
                <td th:text="${customer.phone}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <h3>Lägg till kund</h3>
        <form action="addCustomer" method="post" th:object="${detailedCustomerDto}">
        <label for="firstName">Förnamn:</label><br>
        <input type="text" id="firstName" name="firstName"><br>
        <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}">First name error</span><br>

        <label for="lastName">Efternamn:</label><br>
        <input type="text" id="lastName" name="lastName"><br>
        <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}">Last name error</span><br>

        <label for="email">E-post:</label><br>
        <input type="text" id="email" name="email"><br>
        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</span><br>

        <label for="phone">Telefon:</label><br>
        <input type="text" id="phone" name="phone"><br>
        <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Phone error</span><br>

        <input class="customer-btn" type="submit" value="Lägg till">
    </form>

    <h3>Ändra kund</h3>
    <form method="get" th:action="@{/editCustomer}">
        <label>
            <select name="id" onchange="this.form.submit()">
                <option value="">Välj kund att ändra</option>
                <option th:each="customer : ${allCustomers}"
                        th:value="${customer.id}"
                        th:text="${customer.firstName + ' ' + customer.lastName}"
                        th:selected="${editCustomer != null and editCustomer.id == customer.id}">
                </option>
            </select>
        </label>
    </form>

    <div th:if="${editCustomer != null}">
        <form th:action="@{/editCustomer}" method="post" th:object="${editCustomer}">
            <input type="hidden" th:field="*{id}">
            <label>Förnamn:<br>
                <input type="text" th:field="*{firstName}" required></label><br>
            <label>Efternamn:<br>
                <input type="text" th:field="*{lastName}" required></label><br>
            <label>E-post:<br>
                <input type="text" th:field="*{email}" required></label><br>
            <label>Telefon:<br>
                <input type="text" th:field="*{phone}" required></label><br>
            <input class="customer-btn" type="submit" value="Ändra">
        </form>
    </div>

    <h3>Radera kund</h3>
    <form th:action="@{/deleteCustomer}" method="post">
        <label>
            <select name="deleteId" required>
                <option value="" selected>Välj kund att radera</option>
                <option th:each="customer : ${allCustomers}"
                        th:value="${customer.id}"
                        th:text="${customer.firstName + ' ' + customer.lastName}">
                </option>
            </select>
        </label>
        <input class="customer-btn" type="submit" value="Radera">
    </form>
</div>
</body>
</html>
