<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="Customers"></title>
</head>

<body>
<h3>ManageRooms 1.0</h3>
<a href="/">
    <button>Hem</button>
</a>

<h3>Alla kunder</h3>
<div class="allBooksTable">
<table>
    <tbody>
    <tr th:each="customer : ${allCustomers}">
        <td th:text="${customer.firstName + ' ' + customer.lastName}"></td>
        <td th:text="${customer.email}"></td>
        <td th:text="${customer.phone}"></td>
    </tr>
    </tbody>
</table>
</div>
<br>

<h3>Lägg till kund</h3>
    <form action="addCustomer" method="post">
        <label for="firstName">Förnamn:</label><br>
        <input type="text" id="firstName" name="firstName" required><br>
        <label for="lastName">Efternamn:</label><br>
        <input type="text" id="lastName" name="lastName" required><br>
        <label for="email">E-post:</label><br>
        <input type="text" id="email" name="email" required><br>
        <label for="phone">Telefon:</label><br>
        <input type="text" id="phone" name="phone" required><br>
        <br>
        <input type="submit" value="Lägg till">
    </form>
<br>

<h3>Ändra kund</h3>
<form action="" method="get">
    <label>
        <select name="change" onchange="this.form.submit()">
            <option value="">Välj kund att ändra</option>
            <option th:each="customer : ${allCustomers}"
                    th:value="${customer.id}"
                    th:text="${customer.firstName + ' ' + customer.lastName}"
                    th:selected="${param.change != null and param.change[0] == customer.id.toString()}">
            </option>
        </select>
    </label>
</form>
<br>

<div th:if="${param.change != null and param.change[0] != ''}">
    <form th:action="@{/changeCustomer}" method="post">
        <input type="hidden" name="id" th:value="${param.change[0]}">
        <div th:each="customer : ${allCustomers}"
             th:if="${customer.id.toString() == param.change[0]}">
            <label>Förnamn:<br>
            <input type="text" name="firstName" th:value="${customer.firstName}" required></label><br>
            <label>Efternamn:<br>
            <input type="text" name="lastName" th:value="${customer.lastName}" required></label><br>
            <label>E-post:<br>
            <input type="text" name="email" th:value="${customer.email}" required></label><br>
            <label>Telefon:<br>
            <input type="text" name="phone" th:value="${customer.phone}" required></label><br>
        </div>
        <br>
        <input type="submit" value="Ändra">
    </form>
</div>

<h3>Radera kund</h3>
<form th:action="@{/deleteCustomer}" method="post">
    <label>
        <select name="deleteId" required>
            <option value="" selected>Välj kund att radera</option>
            <option th:each="customer : ${allCustomers}"
                    th:value="${customer.id}"
                    th:text="${customer.firstName + ' ' + customer.lastName}">
            </option>
        </select>
    </label>
    <input type="submit" value="Radera">
</form>

</body>
</html>
